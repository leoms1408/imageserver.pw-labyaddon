name: LabyAddon Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set version from tag
        # v2.1.0 -> 2.1.0, read by build.gradle.kts
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'corretto'
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          validate-wrappers: true
          cache-read-only: true
      - name: Build with Gradle
        run: ./gradlew build --full-stacktrace
      - name: Create Release Artifact
        run: ./gradlew createReleaseJar
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          jar="dist/imageserver-${VERSION}.jar"
          cp build/libs/*-release.jar "$jar"
          gh release create "$GITHUB_REF_NAME" "$jar" --title "$GITHUB_REF_NAME" --generate-notes
